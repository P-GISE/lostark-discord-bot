name: Security gate
on:
  workflow_call:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan tracked source and newly introduced commits
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/security/scan.sh
