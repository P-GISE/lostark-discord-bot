name: Security gate
on:
  workflow_call:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan tracked source and newly introduced commits
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/security/scan.sh
