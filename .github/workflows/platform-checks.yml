name: Platform checks (not production release)
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  security:
    uses: ./.github/workflows/security-gate.yml
  build:
    needs: ["security"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
        cache: npm
    - name: Test bounded TTS queue and compile without starting bot
      run: npm ci --no-audit --no-fund && npm test && npm run build
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: discord-bot-build-${{ github.sha }}
        path: dist/
        if-no-files-found: error
        retention-days: 7
